<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riego | Campo El Avellano</title>
<meta name="description" content="Sistema de riego del campo: pozo, tranque, sectores con goteo, balance hídrico mensual, mantenimiento y registros de riego.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/riego.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="riego.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <nav class="migas" aria-label="Ruta de navegación">
    <a href="index.html">Inicio</a> <span>/</span> <span>Riego</span>
  </nav>

  <header class="pagina-cabecera">
    <h1>Riego</h1>
    <p class="intro">
      Captación desde el pozo, distribución por goteo en los sectores 1 y 2,
      riego por surco en los sectores 3 y 4 y el balance hídrico mes a mes.
    </p>
  </header>

  <div id="contenido-riego"></div>

  <noscript>
    <div class="aviso info">
      Los datos de riego se cargan desde <code>data/riego.js</code>.
      Con JavaScript activado se muestran las tablas completas.
    </div>
  </noscript>
</main>


<script src="data/riego.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script src="js/visor.js"></script>
<script src="js/secciones.js"></script>
<script src="js/buscador.js"></script>
<script>
(function () {
  'use strict';
  var cont = document.getElementById('contenido-riego');

  function pintar() {
    var datos = window.CampoSecciones.riego();
    if (!datos) {
      cont.innerHTML = '<div class="vacio">No hay datos de riego cargados.</div>';
      return;
    }
    window.CampoVisor.renderSeccion(cont, datos);
  }

  if (window.CampoDatos) {
    window.CampoDatos.pintar(pintar);
  } else {
    pintar();
  }
})();
</script>
</body>
</html>
