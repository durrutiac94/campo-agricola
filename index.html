<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campo El Avellano | Gestión del campo avellano-ganadero</title>
<meta name="description" content="Sitio de Gestión del campo avellano-ganadero: avellanos, ovinos, riego por goteo, maquinaria, documentos, bitácoras y calculadoras.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/index.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="index.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <h1 class="solo-lectores">Campo El Avellano</h1>

  <section class="seccion">
    <div class="cab-seccion">
      <h2>Bitácora reciente</h2>
      <div class="cab-acciones" id="acciones-bitacora-portada">
        <a class="btn secundario pequeno" href="bitacora.html#labores">Ver bitácora completa</a>
      </div>
    </div>
    <p class="parrafo-intro">
      Últimos registros de labores. La categoría abre la bitácora filtrada.
    </p>
    <div id="bitacora-portada"></div>
  </section>

  <section class="seccion">
    <div class="cab-seccion">
      <h2>Calendario próximos hitos</h2>
      <div class="cab-acciones" id="acciones-hitos"></div>
    </div>
    <div id="hitos-portada"></div>
  </section>
</main>


<script src="data/campo.js"></script>
<script src="data/calendario.js"></script>
<script src="data/labores.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Campo;
  var LIMITE = 8;
  var CATEGORIAS = {
    avellanos: 'Avellanos',
    ovejas: 'Ovejas',
    riego: 'Riego',
    maquinaria: 'Maquinaria',
    otro: 'Otro'
  };

  function clp(valor) {
    var n = Number(valor) || 0;
    try {
      return new Intl.NumberFormat('es-CL', {
        style: 'currency',
        currency: 'CLP',
        maximumFractionDigits: 0
      }).format(n);
    } catch (e) {
      return '$ ' + n;
    }
  }

  function etiquetaCategoria(categoria) {
    var clave = C.norm(categoria);
    if (CATEGORIAS[clave]) return CATEGORIAS[clave];
    return categoria ? String(categoria) : 'General';
  }

  function urlCategoria(categoria) {
    return 'bitacora.html?categoria=' + encodeURIComponent(C.norm(categoria)) + '#labores';
  }

  function agregarCelda(tr, etiqueta, texto, clase) {
    var td = document.createElement('td');
    td.dataset.label = etiqueta;
    if (clase) td.className = clase;
    td.textContent = texto == null ? '' : texto;
    tr.appendChild(td);
    return td;
  }

  function pintarBitacora() {
    var cont = document.getElementById('bitacora-portada');
    if (!cont) return;
    cont.innerHTML = '';

    var labores = (window.DATOS_LABORES || []).slice().sort(function (a, b) {
      return String(b.fecha || '').localeCompare(String(a.fecha || ''));
    }).slice(0, LIMITE);

    if (!labores.length) {
      cont.appendChild(C.el('div', 'vacio', 'Todavía no hay labores registradas.'));
      return;
    }

    var env = document.createElement('div');
    env.className = 'tabla-envoltura';
    var t = document.createElement('table');
    t.className = 'tabla responsive';

    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    ['Tarea', 'Fecha', 'Categoría', 'Notas', 'Costo'].forEach(function (col) {
      var th = document.createElement('th');
      th.scope = 'col';
      th.textContent = col;
      trh.appendChild(th);
    });
    if (window.CampoEditor && window.CampoEditor.puedeEditar()) {
      var thAcc = document.createElement('th');
      thAcc.scope = 'col';
      thAcc.className = 'col-acciones';
      thAcc.textContent = 'Acciones';
      trh.appendChild(thAcc);
    }
    thead.appendChild(trh);
    t.appendChild(thead);

    var tbody = document.createElement('tbody');
    labores.forEach(function (labor) {
      var tr = document.createElement('tr');
      agregarCelda(tr, 'Tarea', labor.labor || '');
      agregarCelda(tr, 'Fecha', C.fecha ? C.fecha(labor.fecha) : (labor.fecha || ''));

      var tdCat = document.createElement('td');
      tdCat.dataset.label = 'Categoría';
      var clave = C.norm(labor.categoria);
      if (CATEGORIAS[clave]) {
        var enlace = document.createElement('a');
        enlace.href = urlCategoria(labor.categoria);
        enlace.textContent = CATEGORIAS[clave];
        tdCat.appendChild(enlace);
      } else {
        tdCat.textContent = etiquetaCategoria(labor.categoria);
      }
      tr.appendChild(tdCat);

      agregarCelda(tr, 'Notas', labor.observacion || '');
      agregarCelda(tr, 'Costo', clp(labor.costo), 'num');

      if (window.CampoEditor && window.CampoEditor.puedeEditar()) {
        var tdAcc = document.createElement('td');
        tdAcc.className = 'col-acciones';
        tdAcc.dataset.label = 'Acciones';
        var acciones = window.CampoEditor.accionesFila('bitacora', 'labores', labor);
        if (acciones) tdAcc.appendChild(acciones);
        tr.appendChild(tdAcc);
      }
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    env.appendChild(t);
    cont.appendChild(env);
  }

  function pintarHitos() {
    var cont = document.getElementById('hitos-portada');
    if (!cont) return;
    cont.innerHTML = '';

    var datos = window.DATOS_CAMPO || {};
    var hitos = (datos.hitos || []).slice().sort(function (a, b) {
      return String(a.fecha).localeCompare(String(b.fecha));
    }).slice(0, 6);

    if (!hitos.length) {
      cont.appendChild(C.el('div', 'vacio', 'No hay hitos próximos registrados.'));
      return;
    }

    var tabla = document.createElement('div');
    tabla.className = 'tabla-envoltura';
    var t = document.createElement('table');
    t.className = 'tabla responsive';
    t.innerHTML = '<thead><tr><th>Fecha</th><th>Tarea</th><th>Tipo</th></tr></thead><tbody></tbody>';
    var tbody = t.querySelector('tbody');
    hitos.forEach(function (h) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td data-label="Fecha">' + C.esc(C.fecha ? C.fecha(h.fecha) : h.fecha) + '</td>' +
        '<td data-label="Tarea">' + C.esc(h.titulo) + '</td>' +
        '<td data-label="Tipo"><span class="etiqueta">' + C.esc(h.tipo) + '</span></td>';
      tbody.appendChild(tr);
    });
    tabla.appendChild(t);
    cont.appendChild(tabla);
  }

  function pintarAcciones() {
    var bitacora = document.getElementById('acciones-bitacora-portada');
    var hitos = document.getElementById('acciones-hitos');

    [bitacora, hitos].forEach(function (caja) {
      if (!caja) return;
      caja.querySelectorAll('.btn-agregar').forEach(function (boton) {
        boton.remove();
      });
    });

    if (!window.CampoEditor || !window.CampoEditor.puedeEditar()) return;
    if (bitacora) window.CampoEditor.agregarBoton('bitacora', 'labores', 'Agregar labor', bitacora);
    if (hitos) window.CampoEditor.agregarBoton('campo', 'hitos', 'Agregar hito', hitos);
  }

  function pintar() {
    pintarBitacora();
    pintarHitos();
    pintarAcciones();
  }

  if (window.CampoDatos) {
    window.CampoDatos.pintar(pintar);
  } else {
    pintar();
  }
})();
</script>
</body>
</html>
