<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovejas | Campo El Avellano</title>
<meta name="description" content="Rebaño ovino del campo: composición, calendario reproductivo, manejo sanitario, pastoreo, producción e indicadores.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/ovejas.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="ovejas.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <nav class="migas" aria-label="Ruta de navegación">
    <a href="index.html">Inicio</a> <span>/</span> <span>Ovejas</span>
  </nav>

  <header class="pagina-cabecera">
    <h1>Ovejas</h1>
    <p class="intro">
      Rebaño ovino: composición del rodeo, calendario reproductivo, manejo sanitario,
      plan de pastoreo y producción lanera y cárnica.
    </p>
  </header>

  <div id="contenido-ovejas"></div>

  <noscript>
    <div class="aviso info">
      Los datos del rebaño se cargan desde <code>data/ovejas.js</code>.
      Con JavaScript activado se muestran las tablas completas.
    </div>
  </noscript>
</main>


<script src="data/ovejas.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script src="js/visor.js"></script>
<script src="js/secciones.js"></script>
<script src="js/buscador.js"></script>
<script>
(function () {
  'use strict';
  var cont = document.getElementById('contenido-ovejas');

  function pintar() {
    var datos = window.CampoSecciones.ovejas();
    if (!datos) {
      cont.innerHTML = '<div class="vacio">No hay datos del rebaño cargados.</div>';
      return;
    }
    window.CampoVisor.renderSeccion(cont, datos);
  }

  if (window.CampoDatos) {
    window.CampoDatos.pintar(pintar);
  } else {
    pintar();
  }
})();
</script>
</body>
</html>
