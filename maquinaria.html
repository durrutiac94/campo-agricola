<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquinaria | Campo El Avellano</title>
<meta name="description" content="Maquinaria del campo: tractor principal, implementos, herramientas, consumo de combustible y mantenimientos realizados.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/maquinaria.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="maquinaria.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <nav class="migas" aria-label="Ruta de navegación">
    <a href="index.html">Inicio</a> <span>/</span> <span>Maquinaria</span>
  </nav>

  <header class="pagina-cabecera">
    <h1>Maquinaria</h1>
    <p class="intro">
      Tractor, implementos y herramientas del campo, con el consumo de combustible
      y el historial de mantenciones de la temporada.
    </p>
  </header>

  <div id="contenido-maquinaria"></div>

  <noscript>
    <div class="aviso info">
      Los datos de maquinaria se cargan desde <code>data/maquinaria.js</code>.
      Con JavaScript activado se muestran las tablas completas.
    </div>
  </noscript>
</main>


<script src="data/maquinaria.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script src="js/visor.js"></script>
<script src="js/secciones.js"></script>
<script src="js/buscador.js"></script>
<script>
(function () {
  'use strict';
  var cont = document.getElementById('contenido-maquinaria');

  function pintar() {
    var datos = window.CampoSecciones.maquinaria();
    if (!datos) {
      cont.innerHTML = '<div class="vacio">No hay datos de maquinaria cargados.</div>';
      return;
    }
    window.CampoVisor.renderSeccion(cont, datos);
  }

  if (window.CampoDatos) {
    window.CampoDatos.pintar(pintar);
  } else {
    pintar();
  }
})();
</script>
</body>
</html>
