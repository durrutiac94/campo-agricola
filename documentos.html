<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos | Campo El Avellano</title>
<meta name="description" content="Documentos PDF del campo: avellanos, ovinos, riego y maquinaria. Visor embebido, filtros por sección y búsqueda.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/documentos.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="documentos.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <nav class="migas" aria-label="Ruta de navegación">
    <a href="index.html">Inicio</a> <span>/</span> <span>Documentos</span>
  </nav>

  <header class="pagina-cabecera">
    <h1>Documentos</h1>
    <p class="intro">
      Planes, fichas técnicas, registros y protocolos del predio. Los PDF se suben
      desde el editor y se pueden ver directamente en esta página con el visor integrado.
    </p>
  </header>

  <div class="filtros-documentos">
    <div class="filtros-grupo">
      <label>
        <span>Sección</span>
        <select id="filtro-seccion">
          <option value="todos">Todas</option>
        </select>
      </label>
      <label>
        <span>Buscar</span>
        <input type="search" id="filtro-buscar-doc" placeholder="título, descripción o etiqueta..." autocomplete="off">
      </label>
    </div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;align-items:center">
      <button type="button" class="btn pequeno" id="btn-nuevo-doc" hidden>Agregar PDF</button>
      <button type="button" class="btn pequeno" id="btn-varios-doc" hidden>Subir varios PDFs</button>
      <div class="contador-resultados" id="contador-docs"></div>
    </div>
  </div>

  <div id="documentos-lista"></div>

  <noscript>
    <div class="aviso info">
      Los documentos están listados con los datos de <code>data/documentos.js</code>.
      Para abrir los PDF directamente usa los enlaces que aparecen en la lista.
    </div>
  </noscript>
</main>


<script src="data/documentos.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script src="js/visor.js"></script>
<script src="js/buscador.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Campo;
  var V = window.CampoVisor;
  var cont = document.getElementById('documentos-lista');
  var sel = document.getElementById('filtro-seccion');
  var inp = document.getElementById('filtro-buscar-doc');
  var cnt = document.getElementById('contador-docs');
  var btnNuevo = document.getElementById('btn-nuevo-doc');
  var btnVarios = document.getElementById('btn-varios-doc');
  var docs = [];

  function categoriaDoc(d) {
    var seccion = d && d.seccion != null ? String(d.seccion).trim() : '';
    return seccion || 'General';
  }

  function actualizarFiltro() {
    if (!sel) return;
    var categorias = (window.CAMPO_CATEGORIAS_DOCUMENTOS || []).slice();
    if (!categorias.length) categorias = ['Avellanos', 'Ovejas', 'Riego', 'Maquinaria', 'General'];
    docs.forEach(function (d) {
      var categoria = categoriaDoc(d);
      if (categorias.indexOf(categoria) === -1) categorias.push(categoria);
    });
    var actual = sel.value;
    sel.innerHTML = '<option value="todos">Todas</option>' + categorias.map(function (c) {
      return '<option value="' + C.esc(c) + '">' + C.esc(c) + '</option>';
    }).join('');
    sel.value = actual === 'todos' || categorias.indexOf(actual) !== -1 ? actual : 'todos';
  }

  function filtrar() {
    docs = window.DATOS_DOCUMENTOS || [];
    actualizarFiltro();
    var seccion = sel ? sel.value : 'todos';
    var q = inp ? C.norm(inp.value) : '';
    var lista = docs.filter(function (d) {
      var okSec = (seccion === 'todos') || (categoriaDoc(d) === seccion);
      var okQ = !q || C.norm(d.titulo + ' ' + (d.descripcion||'') + ' ' + (d.tags||[]).join(' ')).indexOf(q) !== -1;
      return okSec && okQ;
    });
    if (cnt) cnt.textContent = lista.length + ' documento' + (lista.length === 1 ? '' : 's');
    var puedeEditar = window.CampoEditor && window.CampoEditor.puedeEditar();
    if (btnNuevo) btnNuevo.hidden = !puedeEditar;
    if (btnVarios) btnVarios.hidden = !puedeEditar;
    if (V && V.renderTarjetasDocumentos) V.renderTarjetasDocumentos(cont, lista, { mostrarSeccion: true, origen: { seccion: 'documentos', lista: 'documentos' } });
  }

  if (sel) sel.addEventListener('change', filtrar);
  if (inp) inp.addEventListener('input', filtrar);
  if (btnNuevo) {
    btnNuevo.addEventListener('click', function () {
      if (window.CampoEditor) window.CampoEditor.abrirFormulario('documentos', 'documentos');
    });
  }
  if (btnVarios) {
    btnVarios.addEventListener('click', function () {
      if (window.CampoEditor) window.CampoEditor.abrirCargaDocumentos('documentos', 'documentos');
    });
  }
  if (window.CampoDatos) {
    window.CampoDatos.pintar(filtrar);
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', filtrar);
  } else {
    filtrar();
  }
})();
</script>
</body>
</html>
