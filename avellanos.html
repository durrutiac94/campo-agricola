<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avellanos | Campo El Avellano</title>
<meta name="description" content="Avellano europeo: variedades, fases fenológicas, labores del año, plagas, requisitos climáticos y producción por temporada.">
<meta name="theme-color" content="#0b1d13">
<link rel="canonical" href="https://durrutiac94.github.io/campo-agricola/avellanos.html">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/campo.css">
</head>
<body data-pagina="avellanos.html">

<header class="site-header">
  <div id="barra-header" class="barra contenedor"></div>
</header>

<main class="contenedor">
  <nav class="migas" aria-label="Ruta de navegación">
    <a href="index.html">Inicio</a> <span>/</span> <span>Avellanos</span>
  </nav>

  <header class="pagina-cabecera">
    <h1>Avellanos</h1>
    <p class="intro">
      El huerto de avellano europeo: variedades, ciclo anual, manejo agronómico,
      control de plagas y producción por temporada.
    </p>
  </header>

  <div id="contenido-avellanos"></div>

  <noscript>
    <div class="aviso info">
      Los datos del huerto se cargan desde <code>data/avellanos.js</code>.
      Con JavaScript activado se muestran las tablas completas.
    </div>
  </noscript>
</main>


<script src="data/avellanos.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/manifiesto.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/esquema.js"></script>
<script src="js/editor.js"></script>
<script src="js/visor.js"></script>
<script src="js/secciones.js"></script>
<script src="js/buscador.js"></script>
<script>
(function () {
  'use strict';
  var cont = document.getElementById('contenido-avellanos');

  function pintar() {
    var datos = window.CampoSecciones.avellanos();
    if (!datos) {
      cont.innerHTML = '<div class="vacio">No hay datos del huerto cargados.</div>';
      return;
    }
    window.CampoVisor.renderSeccion(cont, datos);
  }

  if (window.CampoDatos) {
    window.CampoDatos.pintar(pintar);
  } else {
    pintar();
  }
})();
</script>
</body>
</html>
